<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>GoodDoctor - Medical Appointments</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Welcome to GoodDoctor</h1>
            <p>Your trusted medical appointment booking platform</p>
        </header>

        <section class="main">
            <h2>Book an Appointment</h2>
            <form action="/api/appointments" method="POST">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="date">Preferred Date</label>
                <input type="date" id="date" name="date" required>

                <label for="doctor">Select Doctor</label>
                <select id="doctor" name="doctor" required>
                    <option value="dr_smith">Dr. Smith</option>
                    <option value="dr_jones">Dr. Jones</option>
                    <option value="dr_doe">Dr. Doe</option>
                </select>

                <button type="submit">Submit</button>
            </form>
        </section>

        <footer>
            <p>&copy; 2025 GoodDoctor. All Rights Reserved.</p>
        </footer>
    </div>
</body>
</html>
