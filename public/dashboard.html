<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodDoctor - Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <div class="logo">GoodDoctor</div>
            <nav>
                <a href="#" id="logoutBtn">Logout</a>
            </nav>
        </header>

        <div class="sidebar">
            <ul id="menuList">
                <li><a href="#" class="active">Dashboard</a></li>
                <li><a href="#">Appointments</a></li>
                <li><a href="#">Doctors</a></li>
                <li><a href="#">Profile</a></li>
            </ul>
        </div>

        <main>
            <h1>Welcome, <span id="userName">User</span></h1>

            <div class="widgets">
                <div class="widget" id="totalAppointments">
                    <h3>Total Appointments</h3>
                    <p>15</p>
                </div>
                <div class="widget" id="availableDoctors">
                    <h3>Available Doctors</h3>
                    <p>8</p>
                </div>
                <div class="widget" id="upcoming">
                    <h3>Upcoming Appointments</h3>
                    <p>3</p>
                </div>
            </div>

            <section class="appointments">
                <h2>Your Appointments</h2>
                <table id="appointmentsTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Doctor</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Jan 10, 2025</td>
                            <td>Dr. Smith</td>
                            <td>Confirmed</td>
                        </tr>
                        <tr>
                            <td>Jan 15, 2025</td>
                            <td>Dr. Brown</td>
                            <td>Pending</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="firebase-init.js" type="module"></script>
    <script src="dashboard.js" type="module"></script>
</body>
</html>
